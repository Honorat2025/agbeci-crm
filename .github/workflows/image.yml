# Construit l'image Docker de l'application et la publie sur GitHub (ghcr.io).
# Le serveur Hostinger télécharge ensuite cette image toute prête.
name: Image Docker

on:
  push:
    branches: [main, socle-newsletter]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/honorat2025/agbeci-crm:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && 'ghcr.io/honorat2025/agbeci-crm:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
