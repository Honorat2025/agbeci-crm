# Version pour le « Docker Manager » de Hostinger : aucun fichier local nécessaire.
# L'image est construite par GitHub (.github/workflows/image.yml) et publiée sur ghcr.io.
# Les variables (secrets compris) sont fournies par Hostinger, jamais écrites ici.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/honorat2025/agbeci-crm:latest
    pull_policy: always
    restart: unless-stopped
    environment: &appenv
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT}
      DAILY_SEND_LIMIT: ${DAILY_SEND_LIMIT}
      SEND_INTERVAL_MS: ${SEND_INTERVAL_MS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      WP_SHARED_SECRET: ${WP_SHARED_SECRET}
    volumes:
      - backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/honorat2025/agbeci-crm:latest
    pull_policy: always
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment: *appenv
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  # Sauvegarde complète de la base chaque nuit (après 3 h, heure de Paris), gardée 14 jours.
  # Les fichiers sont visibles et téléchargeables dans Réglages. Une copie ratée reste en .tmp
  # (ignorée par l'application) et sera réécrite au prochain essai, 30 minutes plus tard.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: crm
      PGDATABASE: crm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Sauvegardes : chaque nuit après 3 h, conservées 14 jours."
        while true; do
          f=/backups/crm-$$(date +%F).dump
          if [ ! -s "$$f" ] && [ "$$(date +%H)" -ge 3 ]; then
            if pg_dump -Fc -f "$$f.tmp"; then
              mv "$$f.tmp" "$$f" && echo "Sauvegarde faite : $$f ($$(du -h "$$f" | cut -f1))"
              find /backups -name 'crm-*.dump*' -mtime +14 -delete
            else
              echo "ÉCHEC de la sauvegarde $$f, nouvel essai dans 30 minutes"
            fi
          fi
          sleep 1800
        done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${CRM_DOMAIN}", "--to", "app:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
